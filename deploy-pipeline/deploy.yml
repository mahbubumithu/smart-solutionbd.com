name: Automated Deploy to cPanel

on:
  push:
    branches:
      - main
      - master

jobs:
  web-deploy:
    name: Sync Code to cPanel Hosting
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 🚀 Sync Files via FTP / FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CPANEL_FTP_SERVER }}
          username: ${{ secrets.CPANEL_FTP_USERNAME }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          # If your cPanel host uses strict root /public_html:
          server-dir: public_html/
          # Optional: exclude git config, workflows, and local configs from upload
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            README.md
            .cpanel.yml
